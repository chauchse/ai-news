# AI News — configuration globale
# Seul fichier de réglages applicatifs à éditer, à la racine du projet.
# Secrets, adresses de messagerie et URL de déploiement : exclusivement .env.
# Les URL RSS du catalogue sont les sources de veille, pas des URL de déploiement.
# /output, /models et /voices désignent des chemins dans les conteneurs.
# Les valeurs actuelles sont préservées ; ne pas abaisser les seuils pour remplir les quotas.
