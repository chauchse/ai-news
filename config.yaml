# ==========================================================================
# Audio : moteur, voix, pauses et encodage.
# ==========================================================================
audio:
  # Configuration audio AI News
  input: /output/briefing.md
  output: /output/briefing.mp3
  engine: kokoro
  # piper | kokoro | xtts
  language: fr
  voices:
    piper:
      fr: /models/fr_FR-tom-medium.onnx
      en: /models/en_US-lessac-high.onnx
    kokoro:
      fr: ff_siwis
      en: af_heart
    xtts:
      fr: homme_fr
      en: homme_fr
  # Pour XTTS, possibilité de remplacer la voix par un fichier WAV
  xtts_speaker_wav: /voices/homme_fr.wav
  pause_ms: 1200
  title_pause_ms: 600
  bitrate: 48k

# ==========================================================================
# Podcast : métadonnées, éditions et rétention.
# ==========================================================================
podcast:
  # AI News — Podcast (public metadata only)
  cover: cover.jpg
  cover_file: /podcast/cover.jpg
  output_dir: /output
  briefing_file: briefing.md
  state_file: /state/episodes.json
  retention_days: 7

  podcast:
    title: "AI News — Veille IA et cybersécurité"
    description: "Briefing quotidien de veille sur l'intelligence artificielle et
      la cybersécurité fait par IA."
    language: fr-FR
    author: "AI News"
    category: Technology

  # URL publique : PODCAST_SITE_URL dans .env ; suffixe /fr/ ou /en/ automatique.
  # SFTP et adresse de contact : PODCAST_SFTP_HOST, PODCAST_SFTP_PORT,
  # PODCAST_SFTP_REMOTE_PATH et PODCAST_EMAIL dans .env.
  sftp: {}

  # Flux et historiques séparés par langue.
  editions:
    fr:
      state_file: /state/episodes-fr.json
      sftp:
        remote_subdir: fr
      briefing_file: briefing.md
      audio_file: briefing.mp3
    en:
      briefing_file: briefing.md
      audio_file: briefing.mp3
      state_file: /state/episodes-en.json
      podcast:
        title: "AI News — AI and cybersecurity briefing"
        description: "Daily AI-generated technology and cybersecurity briefing."
        language: en-US
      sftp:
        remote_subdir: en

# ==========================================================================
# Surveillance des étapes quotidiennes et alertes SMTP.
# ==========================================================================
healthcheck:
  calendar: hourly
  timezone: Europe/Paris  # À aligner avec le fuseau du cron quotidien du serveur.
  daily_start_hour: 4
  grace_hours: 2
  daily_dir: /output/daily
  log_path: /var/log/ai-news.log
  log_max_bytes: 65536
  log_tail_lines: 200
  subject: "[AI News][ALERTE] Édition {date} incomplète — {count} étape(s)"
  database_backup:
    enabled: true
    directory: /var/backups/ai-news
    retention_days: 30
    compression_level: 6
    timeout_seconds: 600
  repair:
    enabled: true
    stages: [markdown, preview, mail, audio, podcast]
  feedback_import:
    enabled: true
    batch_size: 100
    max_batches: 10
    http_timeout: 30
    max_response_bytes: 1048576
    connect_timeout: 10
    # URL et secret API distinct du secret des liens : variables .env.
    endpoint_env: FEEDBACK_URL
    api_secret_env: FEEDBACK_API_SECRET
    implicit_useful:
      enabled: true  # La veille, après import complet et au moins un vote article/global.

# ==========================================================================
# Courriel : objets localisés et transport SMTP.
# ==========================================================================
mail:
  input: /output/briefing.md
  subject: "AI News — Briefing du {date}"
  feedback:
    newsletter_enabled: true
  smtp:
    host: ssl0.ovh.net
    port: 587
    security: starttls  # starttls (587), ssl (465), none (relais local sans auth)
    auth: true
    timeout: 30
  # Identifiants exclusivement dans .env : SMTP_USERNAME et SMTP_PASSWORD.

  # Expéditeur et destinataire : SENDER et RECIPIENT dans .env.
  # Objets personnalisables par édition.
  editions:
    en:
      subject: "AI News — Daily briefing {date}"
    fr:
      subject: "AI News — Briefing du {date}"
