services:
  postgres:
    image: postgres:17
    container_name: ai-news-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SOURCES_FILE: /app/config/sources.yaml
      FEEDBACK_CONFIG: /app/config/feedback.yaml
      FEEDBACK_API_SECRET: ${FEEDBACK_API_SECRET:-}
      FEEDBACK_URL: ${FEEDBACK_URL:-}
    volumes:
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy

  embeddings:
    build:
      context: .
      dockerfile: embeddings/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HF_HOME: /models
      OMP_NUM_THREADS: "4"
      BRIEFING_CONFIG: /config/briefing.yaml
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      FEEDBACK_CONFIG: /config/feedback.yaml
    volumes:
      - embeddings_models:/models
      - ./config:/config:ro
      - ./output:/output
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 6g
    profiles:
      - ai

  ollama:
    image: ollama/ollama:latest
    container_name: ai-news-ollama
    restart: unless-stopped
    profiles:
      - ai
    environment:
      OLLAMA_NUM_THREADS: "4"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "0"
    volumes:
      - ollama_models:/root/.ollama
    mem_limit: 4g

  audio:
    profiles: [ai]
    build:
      context: .
      dockerfile: audio/Dockerfile
    command: ["--config", "/config/audio.yaml"]
    environment:
      TZ: Europe/Paris
    volumes:
      - ./config:/config:ro
      - ./audio/models:/models:ro
      - ./audio/voices:/voices:ro
      - ./output:/output
    mem_limit: 2g

  xtts:
    profiles: [xtts]
    build:
      context: .
      dockerfile: audio/xtts/Dockerfile
    environment:
      TZ: Europe/Paris
      TTS_HOME: /models
      OMP_NUM_THREADS: "4"
    volumes:
      - ./config:/config:ro
      - ./audio/models/xtts:/models
      - ./audio/voices:/voices:ro
      - ./output:/output
    mem_limit: 6g
    command: ["--config", "/config/audio.yaml"]

  podcast:
    build:
      context: .
      dockerfile: podcast/Dockerfile
    profiles: [ai]
    env_file:
      - .env
    environment:
      TZ: Europe/Paris
    volumes:
      - ./config:/config:ro
      - ./output:/output
      - ./podcast/cover.jpg:/podcast/cover.jpg:ro
      - ./podcast/state:/state
      - /home/seb/.ssh/known_hosts:/root/.ssh/known_hosts:ro
    mem_limit: 256m

  mailer:
    profiles: [mail]
    build:
      context: .
      dockerfile: mailer/Dockerfile
    environment:
      TZ: Europe/Paris
      SENDER: ${SENDER:-}
      RECIPIENT: ${RECIPIENT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FEEDBACK_SIGNING_SECRET: ${FEEDBACK_SIGNING_SECRET:-}
      FEEDBACK_URL: ${FEEDBACK_URL:-}
    volumes:
      - ./config:/config:ro
      - ./output:/output
    mem_limit: 256m

  feedback-learning:
    profiles: [learning]
    build:
      context: .
      dockerfile: feedback/Dockerfile.learning
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FEEDBACK_CONFIG: /config/feedback.yaml
    volumes:
      - ./config:/config:ro
      - ./output:/output
    mem_limit: 2g

volumes:
  postgres_data:
  embeddings_models:
  ollama_models: