services:
  postgres:
    image: postgres:17
    container_name: ai-news-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SOURCES_FILE: /app/config/sources.yaml
    depends_on:
      postgres:
        condition: service_healthy

  embeddings:
    build:
      context: .
      dockerfile: embeddings/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HF_HOME: /models
      OMP_NUM_THREADS: "4"
      BRIEFING_CONFIG: /config/briefing.yaml
    volumes:
      - embeddings_models:/models
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 6g
    profiles:
      - ai

  ollama:
    image: ollama/ollama:latest
    container_name: ai-news-ollama
    restart: unless-stopped
    profiles:
      - ai
    environment:
      OLLAMA_NUM_THREADS: "4"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HF_HOME: /models
      OMP_NUM_THREADS: "4"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
    volumes:
      - ollama_models:/root/.ollama
    mem_limit: 4g

volumes:
  postgres_data:
  embeddings_models:
  ollama_models:
