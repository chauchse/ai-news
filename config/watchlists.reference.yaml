# Les règles portent par défaut sur le titre et le résumé.
# mode: literal (défaut) ou regex ; operator: any (défaut) ou all
# Example only: do not overwrite your existing watchlists.yaml
whitelist:
  - name: Technologies suivies
    keywords: [Elasticsearch, Elastic Security, VMware, Microsoft 365]
    scope: title_summary
    priority: high
  - name: IA stratégique
    keywords: [OpenAI, Anthropic, AI agents, intelligence artificielle]
    priority: normal
blacklist:
  - name: Jeux vidéo grand public
    keywords: [Steam Deck, PlayStation, Xbox, PS5, Nintendo]
    absolute: false
  - name: Promotions
    keywords: [giveaway, sponsored content]
    absolute: false

# Une blacklist absolute: true exclut même une alerte de sécurité.
