briefing:
  language: fr  # mode historique, utilisé si languages est absent
  languages: [en, fr]
  max_events: 15
  min_relevance_score: 35
  lookback_hours: 24
  history:
    days: 7
    similarity_threshold: 0.72

  business_triage:
    max_candidates: 50
    max_dedup_reviews: 8

    max_security_alerts: 4
    max_strategic_events: 10
    max_p1_overflow: 2

    min_strategic_importance: 2

    max_security_watch_appendix: 6

  selection:
    security:
      target: 3
    artificial_intelligence:
      target: 5
    regulation_and_risk:
      target: 2
    gaming_and_transformation:
      target: 3

    flexible_quotas: true
    critical_security_override: true

llm:
  model: qwen2.5:3b
  temperature: 0

scoring:
  rescore_all: true

  domains:
    artificial_intelligence:
      weight: 30
    cybersecurity:
      weight: 20
    risk_management:
      weight: 10
    digital_transformation:
      weight: 25
    regulation:
      weight: 10
    gaming_industry:
      weight: 5

  business_context:
    country: LU
    industry: casino
    priorities:
      - ai_adoption
      - process_automation
      - data_analytics
      - digital_transformation
      - cloud_infrastructure
      - infrastructure_security
      - business_continuity
      - fraud_detection
      - operational_risk

  online_gaming_priority: low