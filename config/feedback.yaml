# Enable only after migration 005 and configuration of the public endpoint.
enabled: false
link_days: 90
batch_size: 500
max_batches: 20
http_timeout: 15
max_response_bytes: 2097152
personalization:
  mode: shadow # off, shadow, active (explicit activation)
  max_examples: 4
  min_similarity: 0.55
  max_adjustment: 20
  max_candidates: 50
  min_training_events: 100
  min_class_events: 10
  discovery_slots: 0 # 0 or 1; explicit exploration, only in active mode.
  feature_version: editorial-v1
  model_path: /output/feedback-models/active.json
